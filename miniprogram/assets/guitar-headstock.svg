<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720" role="img" aria-labelledby="title description">
  <title id="title">Six-string guitar headstock</title>
  <desc id="description">A mahogany three-a-side headstock with ivory binding and chrome tuning keys. Left: 4 D, 5 A, 6 E. Right: 3 G, 2 B, 1 E.</desc>
  <defs>
    <path id="outline" d="M210 720V580 C210 535 187 509 166 482 C162 477 162 471 164 460 C180 365 174 238 160 150 C181 145 188 133 192 119 C222 119 241 83 280 82 C319 83 338 119 368 119 C372 133 379 145 400 150 C386 238 380 365 396 460 C398 471 398 477 394 482 C373 509 350 535 350 580 V720Z"/>
    <clipPath id="wood-clip"><use href="#outline"/></clipPath>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#32170e"/><stop offset=".2" stop-color="#71351c"/>
      <stop offset=".48" stop-color="#a45b30"/><stop offset=".7" stop-color="#804020"/><stop offset="1" stop-color="#3b1b11"/>
    </linearGradient>
    <!-- Small repeating grain stays inside the silhouette; no SVG filters required. -->
    <pattern id="grain" width="37" height="180" patternUnits="userSpaceOnUse">
      <path d="M2-10 C9 40-3 85 4 190 M13-20 C6 30 20 100 12 190 M28-10 C18 55 34 110 26 190 M35-10 C31 60 39 120 34 190" fill="none" stroke="#210d07" stroke-opacity=".22" stroke-width="1"/>
      <path d="M7-10 C14 45 5 115 10 190 M22-10 C16 70 28 130 20 190" fill="none" stroke="#edb076" stroke-opacity=".14" stroke-width=".7"/>
    </pattern>
    <linearGradient id="lacquer" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#ffd9a1" stop-opacity=".15"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#120500" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".15" y2="1">
      <stop stop-color="#13191c"/><stop offset=".25" stop-color="#505b60"/><stop offset=".44" stop-color="#dbe6e9"/>
      <stop offset=".52" stop-color="#f8ffff"/><stop offset=".66" stop-color="#a5b3b9"/><stop offset=".84" stop-color="#485359"/><stop offset="1" stop-color="#161c20"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3c454b"/><stop offset=".3" stop-color="#f0f6f7"/><stop offset=".5" stop-color="#667078"/>
      <stop offset=".7" stop-color="#ecf4f5"/><stop offset="1" stop-color="#242a2e"/>
    </linearGradient>
    <radialGradient id="washer" cx=".35" cy=".25" r=".75">
      <stop stop-color="#ffffff"/><stop offset=".38" stop-color="#dce0e0"/><stop offset=".65" stop-color="#828b8e"/>
      <stop offset=".82" stop-color="#c1c9cc"/><stop offset="1" stop-color="#40484c"/>
    </radialGradient>
    <linearGradient id="post-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7d868a"/><stop offset=".45" stop-color="#f3f7f7"/><stop offset="1" stop-color="#879196"/>
    </linearGradient>
    <g id="left-peg">
      <rect x="125" y="-8" width="85" height="16" rx="3" fill="url(#shaft)" stroke="#202629"/>
      <path d="M143-8V8 M150-8V8" stroke="#d8e1e4" stroke-width="2"/>
      <path d="M129-27 C121-34 100-29 85-19 C65-5 67 16 86 25 C100 32 120 33 129 26 C134 17 133-18 129-27Z" fill="#11171a" stroke="#758084" stroke-width="1.5"/>
      <path d="M125-25 C113-28 96-21 87-14 C74-3 76 13 89 21 C100 27 116 29 125 24 C128 12 128-13 125-25Z" fill="url(#chrome)"/>
      <path d="M81-9 C87-20 108-28 121-26" fill="none" stroke="#e1e6e6" stroke-opacity=".65"/>
    </g>
    <g id="post">
      <ellipse cy="3" rx="20" ry="21" fill="#160e0a" fill-opacity=".6"/>
      <circle r="19" fill="url(#washer)" stroke="#ced3d2" stroke-width=".8"/>
      <circle r="12" fill="url(#post-face)" stroke="#eef2f2" stroke-width=".8"/>
      <path d="M-8-7 Q-2-12 6-8" fill="none" stroke="#fff" stroke-opacity=".6"/>
    </g>
  </defs>

  <g id="tuning-keys">
    <use href="#left-peg" transform="translate(0 190)"/><use href="#left-peg" transform="translate(0 310)"/><use href="#left-peg" transform="translate(0 430)"/>
    <use href="#left-peg" transform="translate(560 190) scale(-1 1)"/><use href="#left-peg" transform="translate(560 310) scale(-1 1)"/><use href="#left-peg" transform="translate(560 430) scale(-1 1)"/>
  </g>
  <g id="headstock">
    <use href="#outline" fill="url(#wood)" stroke="#281a13" stroke-width="9"/>
    <use href="#outline" fill="url(#grain)"/>
    <use href="#outline" fill="url(#lacquer)"/>
    <g clip-path="url(#wood-clip)" fill="none">
      <use href="#outline" stroke="#f0e6cf" stroke-width="10"/>
      <use href="#outline" stroke="#8e6845" stroke-width="3"/>
    </g>
    <!-- The neck and truss rod cover sit beneath the strings. -->
    <path d="M215 584H345V720H215Z" fill="#362117"/>
    <path d="M219 600H341 M219 661H341" stroke="#79634d" stroke-width="3"/>
    <path d="M254 576 C257 544 250 515 249 493 C248 468 260 450 280 449 C300 450 312 468 311 493 C310 515 303 544 306 576Z" fill="#21130e" stroke="#9f7150" stroke-width=".8"/>
    <g fill="url(#washer)" stroke="#303334" stroke-width=".7">
      <circle cx="280" cy="463" r="3.5"/><circle cx="280" cy="564" r="3.5"/>
    </g>
    <path d="M278 463H282 M278 564H282" stroke="#323637"/>
  </g>
  <g id="tuning-posts">
    <use href="#post" x="210" y="190"/><use href="#post" x="210" y="310"/><use href="#post" x="210" y="430"/>
    <use href="#post" x="350" y="190"/><use href="#post" x="350" y="310"/><use href="#post" x="350" y="430"/>
  </g>
  <rect id="nut" x="210" y="576" width="140" height="14" rx="1" fill="#e9dfc9" stroke="#a79b84" stroke-width="1.5"/>
  <path d="M211 588H349" stroke="#645344" stroke-width="2"/>
  <!-- Straight string runs fan from the nut to their own tuning post. -->
  <g id="strings" fill="none" stroke="#c9cecc" stroke-linecap="round" stroke-linejoin="round">
    <path id="string-6" d="M230 720V583L214 438" stroke-width="3.5"/>
    <path id="string-5" d="M250 720V583L214 318" stroke-width="3"/>
    <path id="string-4" d="M270 720V583L214 198" stroke-width="2.5"/>
    <path id="string-3" d="M290 720V583L346 198" stroke-width="2"/>
    <path id="string-2" d="M310 720V583L346 318" stroke-width="1.5"/>
    <path id="string-1" d="M330 720V583L346 438" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width=".65">
    <path d="M229 720V583L213 438 M249 720V583L213 318 M269 720V583L213 198"/>
  </g>
  <g id="labels" fill="#f3f5f3" stroke="#182024" stroke-width=".6" paint-order="stroke" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="103" y="190">4 · D</text><text x="103" y="310">5 · A</text><text x="103" y="430">6 · E</text>
    <text x="457" y="190">3 · G</text><text x="457" y="310">2 · B</text><text x="457" y="430">1 · E</text>
  </g>
</svg>
